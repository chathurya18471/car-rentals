<!DOCTYPE html>
<html>
<head>
    <title>Car Rental Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🚗 Car Rental System</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#cars">Cars</a>
        <a href="#booking">Booking</a>
    </nav>
</header>

<section id="home" class="hero">
    <h2>Find Your Perfect Ride</h2>
    <p>Rent your favorite car at affordable prices.</p>
    <a href="#cars" class="btn">Explore Cars</a>
</section>

<section id="cars">
    <h2>Available Cars</h2>

    <div class="car-container">

        <div class="car">
            <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600" alt="Ford Mustang">
            <h3>Ford Mustang</h3>
            <p>Price: ₹3000 / day</p>
            <button onclick="bookCar('Ford Mustang',3000)">Book Now</button>
        </div>

        <div class="car">
            <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600" alt="Chevrolet Camaro">
            <h3>Chevrolet Camaro</h3>
            <p>Price: ₹2500 / day</p>
            <button onclick="bookCar('Chevrolet Camaro',2500)">Book Now</button>
        </div>

        <div class="car">
            <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600" alt="Porsche">
            <h3>Porsche 911</h3>
            <p>Price: ₹5000 / day</p>
            <button onclick="bookCar('Porsche 911',5000)">Book Now</button>
        </div>

    </div>
</section>

<section id="booking">
    <h2>Book Your Car</h2>

    <form id="bookingForm">
        <input type="text" id="name" placeholder="Customer Name" required>

        <input type="text" id="carName" placeholder="Car Name" readonly required>

        <input type="number" id="price" placeholder="Price Per Day" readonly required>

        <label>Pickup Date</label>
        <input type="date" id="pickup" required>

        <label>Return Date</label>
        <input type="date" id="return" required>

        <button type="submit">Confirm Booking</button>
    </form>

    <div id="result"></div>
</section>

<footer>
    <p>© 2026 Car Rental Management System</p>
</footer>

<script src="script.js"></script>
</body>
</html>
